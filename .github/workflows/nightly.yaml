name: Build and upload forge nightly

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches:
      - nightly
      - add-nightly-build  # TODO: remove this line after PR is accepted. This is for testing.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: forge-cu128-nightly
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    strategy:
      fail-fast: false
    with:
      repository: meta-pytorch/forge
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      run-smoke-test: false
      wheel-nightly-policy: gha_workflow_nightly_build_wheels
      wheel-upload-path: whl/nightly/forge/
      package-name: forge
      # Channel = PyPI index URL for PyTorch installation
      # nightly → https://download.pytorch.org/whl/nightly/cu128 (latest daily builds)
      # test → https://download.pytorch.org/whl/test/cu128 (stable releases like 2.9.0)
      channel: nightly
      build-matrix: |
        {
          "include": [
            {
              "python_version": "3.10",
              "gpu_arch_type": "cpu",
              "gpu_arch_version": "12.8",
              "desired_cuda": "cu128",
              "container_image": "pytorch/manylinux2_28-builder:cuda12.8",
              "package_type": "manywheel",
              "build_name": "manywheel-py3_10-cuda12_8",
              "validation_runner": "linux.12xlarge.memory",
              "upload_to_base_bucket": "no",
              "use_split_build": false
            },
            {
              "python_version": "3.11",
              "gpu_arch_type": "cpu",
              "gpu_arch_version": "12.8",
              "desired_cuda": "cu128",
              "container_image": "pytorch/manylinux2_28-builder:cuda12.8",
              "package_type": "manywheel",
              "build_name": "manywheel-py3_10-cuda12_8",
              "validation_runner": "linux.12xlarge.memory",
              "upload_to_base_bucket": "no",
              "use_split_build": false
            },
            {
              "python_version": "3.12",
              "gpu_arch_type": "cpu",
              "gpu_arch_version": "12.8",
              "desired_cuda": "cu128",
              "container_image": "pytorch/manylinux2_28-builder:cuda12.8",
              "package_type": "manywheel",
              "build_name": "manywheel-py3_10-cuda12_8",
              "validation_runner": "linux.12xlarge.memory",
              "upload_to_base_bucket": "no",
              "use_split_build": false
            },
          ]
        }
      pre-script: .github/packaging/pre_build_nightly.sh
      post-script: .github/packaging/post_build_script.sh
      trigger-event: ${{ github.event_name }}
      build-platform: 'python-build-package'
