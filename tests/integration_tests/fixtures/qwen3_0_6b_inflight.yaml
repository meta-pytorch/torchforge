# Lightweight config for in-flight weight update testing
# Uses Qwen3-0.6B for fast iteration

# Global configuration
group_size: 2
batch_size: 2
max_req_tokens: 128
max_res_tokens: 128
model: "Qwen/Qwen3-0.6B"
compile: false  # Disable compile for faster test startup

# Policy configuration (Generator)
policy:
  engine_args:
    model: ${model}
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    enforce_eager: true
    max_model_len: 512
    gpu_memory_utilization: 0.5
  sampling_params:
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0
    top_p: 1.0

# Trainer configuration
trainer:
  model:
    name: qwen3
    flavor: 0.6B
    hf_assets_path: hf://${model}
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8
  lr_scheduler:
    warmup_steps: 1
  training:
    local_batch_size: ${batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 10
    dtype: bfloat16
    gc_freq: 1
  compile:
    enable: ${compile}
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true
  checkpoint:
    enable: true
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 500
    async_mode: "disabled"
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

# Resource allocations
services:
  policy:
    procs: 1
    num_replicas: 4  # Reduced from 6 to avoid Monarch concurrency issues
    with_gpus: true

actors:
  trainer:
    procs: 1
    num_replicas: 1
    with_gpus: true
